name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/server/target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo build
      - run: cargo test

  # Windows MSI: ICE57 must stay green (file associations ≠ Path component).
  windows-msi:
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/desktop/target
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            server
            desktop
          shared-key: windows-msi
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked
      - name: Fetch Tesseract traineddata
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path server/tessdata | Out-Null
          foreach ($lang in @("eng", "chi_tra")) {
            $out = "server/tessdata/$lang.traineddata"
            curl.exe -fSL -o $out "https://github.com/tesseract-ocr/tessdata/raw/main/$lang.traineddata"
          }
      - uses: astral-sh/setup-uv@v3
      # Without this the MSI installs with no Python at all and every
      # docx/xlsx/markdown export 500s at runtime as "conversion failed" — the
      # bundle's own build gate (desktop/windows/verify-python-embed.ps1, run by
      # `cargo tauri build` below) exists specifically to fail loud here instead
      # of shipping that silently. uv is what pins the installed dependency
      # versions to python/uv.lock; without it on PATH the script still works but
      # warns and falls back to the loose pyproject.toml specs.
      - name: Build embedded Python sidecar
        shell: pwsh
        run: .\desktop\windows\prepare-python-embed.ps1
      - name: Build MSI
        shell: pwsh
        run: .\scripts\build-msi.ps1
      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-editor-msi
          path: desktop/target/release/bundle/msi/*.msi
          if-no-files-found: error
      - name: Attach MSI to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $msi = Get-ChildItem desktop/target/release/bundle/msi/*.msi | Select-Object -First 1
          if (-not $msi) { throw "MSI not found" }
          # Create draft release if missing, then attach MSI.
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $tag --generate-notes
          }
          gh release upload $tag $msi.FullName --clobber
